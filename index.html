<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Improvement Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f7f7f4">
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light;
 --bg:#f7f7f4;--surface:#fff;--ink:#1b1c1f;--ink-2:#55575e;--ink-3:#8b8d94;--line:#e6e5df;--line-2:#f1f0eb;
 --accent:#2d5be3;--accent-ink:#1f43b5;--accent-soft:#edf1fd;
 --good:#1f8a4c;--good-soft:#e7f3eb;--half:#b7791f;--half-soft:#fbf2e2;--bad:#c53030;--bad-soft:#fbeaea;--warn:#b7791f;--warn-soft:#fbf2e2;
 --muted:var(--ink-3);--card:var(--surface);
 --r:16px;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 24px}
/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 6px;font-weight:700}
#sub{font-size:14px;color:var(--ink-2)}
.icons{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ibtn:hover{color:var(--ink)}
.ibtn svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#syncbtn{display:none}
/* navigation: bottom bar on phones, sidebar on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 8px;border-radius:10px;cursor:pointer;min-width:58px}
.nav button.on{color:var(--accent)}
.nav .brand,.nav .wide{display:none}
@media (min-width:900px){
 body{padding-bottom:0}
 .nav{top:0;right:auto;width:228px;flex-direction:column;justify-content:flex-start;gap:2px;padding:24px 14px;border-top:0;border-right:1px solid var(--line);background:var(--bg);backdrop-filter:none}
 .nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:0 10px 18px}
 .nav .brand img{width:28px;height:28px;border-radius:8px}
 .nav .wide{display:flex}
 .nav button{flex-direction:row;gap:12px;font-size:14.5px;font-weight:500;color:var(--ink-2);padding:9px 12px;width:100%}
 .nav button:hover{background:var(--line-2)}
 .nav button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
 .nav button.on svg{color:var(--accent)}
 .wrap{margin-left:228px;max-width:none;padding:28px 40px}
 main,.top{max-width:860px}
 .mob{display:none}
}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 10px}
.card h3{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;font-size:14px}
.btn:hover{border-color:#cfcec7}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.alert{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:14px;color:var(--ink)}
.alert.warn{border-left-color:var(--half)}
.alert.bad{border-left-color:var(--bad)}
.alert.good{border-left-color:var(--good)}
.alert.info{border-left-color:var(--accent)}
/* day plan */
.block{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line-2)}
.block:first-of-type{border-top:0;padding-top:4px}
.time{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;font-weight:550;padding-top:2px}
.block .title{font-weight:650;font-size:15.5px;letter-spacing:-.005em}
.block .detail{margin-top:2px;color:var(--ink-2)}
.block .min{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.check{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:2px 0;color:var(--ink-3);font-size:13px;font-weight:550}
.check .dot{width:28px;height:28px;border-radius:50%;border:1.75px solid #c9c8c1;display:grid;place-items:center;font-size:15px;line-height:1;color:#fff;transition:all .15s}
.check:hover .dot{border-color:var(--ink-2)}
.check.s1{color:var(--good)} .check.s1 .dot{background:var(--good);border-color:var(--good)} .check.s1 .dot::after{content:"\2713"}
.check.s5{color:var(--half)} .check.s5 .dot{border-color:var(--half);background:linear-gradient(90deg,var(--half) 50%,transparent 50%)}
.check.s0{color:var(--bad)} .check.s0 .dot{border-color:var(--bad);color:var(--bad)} .check.s0 .dot::after{content:"\00d7"}
.check .lab{min-width:62px;text-align:left}
/* controls */
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)}
input[type=number],input[type=text],input[type=date],input[type=time],textarea,select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:64px;resize:vertical;margin-top:4px}
input.n{width:68px;padding:6px 8px}
label.small{display:block;margin-bottom:10px;color:var(--ink-2)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.lift{margin:2px 0 6px}
.lift td{padding:8px 6px}
/* week grid */
.wk{display:grid;grid-template-columns:100px repeat(7,1fr);gap:5px;font-size:13px}
.wk .h{color:var(--ink-3);font-weight:600;text-align:center;padding:4px 0;font-size:12px}
.wk .h.today{color:var(--accent)}
.wk .lbl{font-weight:600;padding:9px 0;color:var(--ink-2)}
.cell{border-radius:10px;text-align:center;padding:8px 0;cursor:pointer;background:var(--line-2);color:var(--ink-3);user-select:none;font-weight:600}
.cell.s1{background:var(--good-soft);color:var(--good)}
.cell.s5{background:var(--half-soft);color:var(--half)}
.cell.s0{background:var(--bad-soft);color:var(--bad)}
.cell.na{cursor:default;background:none;color:var(--line)}
.big3 label{display:flex;gap:10px;align-items:center;margin:8px 0}
.big3 input[type=text]{flex:1}
.big3 input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}
/* stats */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;font-size:11px;max-width:420px}
.heat div{height:20px;border-radius:5px}
.heat .lab{height:auto;color:var(--ink-3)}
.bar{height:6px;background:var(--line-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
details{border-top:1px solid var(--line-2);padding:10px 0}
summary{cursor:pointer;font-weight:600}
ul,ol{margin:6px 0;padding-left:20px;color:var(--ink-2)}
li{margin:4px 0}
code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:13px}
.hide{display:none}
/* spreadsheet */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.xl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.xl th,table.xl td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;height:34px;text-align:center;white-space:nowrap;vertical-align:middle}
table.xl tr:last-child td{border-bottom:0}
table.xl th{background:#fafaf8;position:sticky;top:0;z-index:1;padding:5px 6px;font-weight:600;color:var(--ink-3);font-size:11.5px;border-bottom:1px solid var(--line)}
table.xl td.lbl,table.xl th.lbl{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 10px;font-weight:600;color:var(--ink);border-right:1px solid var(--line)}
table.xl th.lbl{background:#fafaf8;z-index:3}
table.xl th.today{color:var(--accent);background:var(--accent-soft)}
table.xl td.c{min-width:32px;cursor:pointer;user-select:none;font-weight:700}
table.xl td.c:hover{background:var(--line-2)}
table.xl td.c.s1{background:var(--good-soft);color:var(--good)}
table.xl td.c.s5{background:var(--half-soft);color:var(--half)}
table.xl td.c.s0{background:var(--bad-soft);color:var(--bad)}
table.xl td.c.na{cursor:default;background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line-2) 5px 6px)}
table.xl td.tot{font-weight:700;padding:0 10px;font-variant-numeric:tabular-nums}
table.xl input,table.xl select{border:0;background:transparent;border-radius:0;width:100%;height:34px;padding:0 8px;box-shadow:none}
table.xl input[type=checkbox]{width:18px;height:18px;accent-color:var(--good)}
table.goals td{text-align:left}
table.goals tr.done td{background:#f6faf7}
table.goals tr.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
table.goals tr.late td{background:#fdf6f6}
table.goals tr.late input[data-gf=due]{color:var(--bad);font-weight:600}
.pbar{display:flex;align-items:center;gap:8px;padding:0 8px;min-width:130px}
.pbar .bar{flex:1}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2);font-weight:550}
/* planner */
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
.task .tt{flex:1}
.task .time{min-width:44px}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;padding:0 4px}
.x:hover{color:var(--bad)}
.form{display:grid;grid-template-columns:2fr 1.1fr .9fr 1fr .9fr auto;gap:8px}
@media (max-width:620px){
 .wrap{padding:14px 14px 20px}
 .top h1{font-size:28px}
 .form{grid-template-columns:1fr 1fr}.form input[type=text]{grid-column:1/-1}.form .btn{grid-column:1/-1}
 .block{grid-template-columns:1fr auto;gap:4px 12px}
 .block .time{grid-column:1/-1;padding:0}
 .wk{grid-template-columns:64px repeat(7,1fr);gap:3px;font-size:12px}
 .check .lab{display:none}
}
/* week strip on Today */
.strip{display:flex;align-items:stretch;gap:6px;margin-bottom:16px}
.strip .ibtn{width:34px;height:auto;flex:none}
.sday{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.sday span{font-size:11px;color:var(--ink-3);font-weight:600}
.sday b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.sday i{display:block;width:58%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--good) calc(var(--p)*1%),var(--line-2) 0)}
.sday.now b{color:var(--accent)}
.sday.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.sday.sel span{color:rgba(255,255,255,.65)}
.sday.sel b{color:#fff}
.sday.sel i{background:linear-gradient(90deg,#7ee2a5 calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
@media (max-width:420px){.strip{gap:4px}.strip .ibtn{width:26px}.sday{border-radius:12px}}
.block.fixed{padding:9px 0}
.block.fixed .title{color:var(--ink-3);font-weight:550;font-size:14px}
.block.fixed.work .title{color:var(--ink-2)}
.block.fixed.class .title{color:var(--accent-ink)}
/* live layer */
.card.now{padding:18px 20px;background:linear-gradient(180deg,#fff, #fbfbf9)}
.now-grid{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.now-ring{position:relative;width:68px;height:68px}
.now-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;letter-spacing:-.02em}
.now-ring b small{font-size:11px;color:var(--ink-3);font-weight:600}
.now-title{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:2px;line-height:1.25}
.now-sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.now-then{color:var(--ink-3);font-size:13px;margin-top:8px}
.now-then b{color:var(--ink-2);font-weight:600}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,76,.45)}70%{box-shadow:0 0 0 7px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}
.mom{display:flex;align-items:flex-end;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.spark{flex:1;display:flex;align-items:flex-end;gap:4px;height:34px}
.spark i{flex:1;background:var(--good-soft);border-radius:3px;min-height:3px;transition:height .4s}
.spark i.today{background:var(--good)}
.acts{display:flex;align-items:center;gap:10px}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;flex:none}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
.check.s1 .dot{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.focus{position:fixed;inset:0;z-index:50;background:rgba(247,247,244,.97);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.f-in{max-width:520px;width:100%;text-align:center}
.f-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 18px}
.f-ring{position:relative;width:220px;height:220px;margin:0 auto}
.f-ring svg{display:block}
.f-time{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.f-detail{color:var(--ink-2);margin-top:18px;font-size:15px}
.f-stats{color:var(--ink-3);font-size:13px;margin-top:6px}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:280px}
.rest div{flex:1;display:flex;flex-direction:column}
.rest b{font-size:17px;font-variant-numeric:tabular-nums}
.rest span{font-size:12px;opacity:.7}
.rest .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;padding:6px 10px}
.rest .x{color:#fff;opacity:.7}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:18px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(20,20,22,.28);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
input.qa,#qs{width:100%;font-size:16px;padding:12px 14px}
.qa-prev{display:flex;flex-wrap:wrap;gap:6px;min-height:8px;margin:8px 0}
.chip{font-size:12.5px;padding:3px 9px;border-radius:7px;background:var(--line-2);color:var(--ink-2);font-weight:550}
.chip.strong{background:var(--accent-soft);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:18px;z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hide.focus,.hide.rest,.hide.sheet,.hide.toast{display:none}
@media (min-width:900px){.fab{bottom:28px;right:28px}.rest{bottom:28px}.sheet{align-items:center}.sheet-in{border-radius:20px}}
@media (max-width:620px){.now-grid{grid-template-columns:auto 1fr}.now-act{grid-column:1/-1}.now-act .btn{width:100%}}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.lock-in img{border-radius:16px;margin-bottom:6px}
.lock-in h1{font-size:26px;letter-spacing:-.02em;margin:0}
.lock-in p{margin:0;color:var(--ink-2)}
.lock-in input{width:100%;font-size:16px;padding:12px 14px;text-align:center}
.lock-in .btn{width:100%;padding:12px}
.lock-err{color:var(--bad);min-height:20px;font-size:14px}
.lock-note{font-size:12.5px;color:var(--ink-3)!important}
.lock-home{font-size:13px;color:var(--ink-3);margin-top:10px}
.lock.hide{display:none}
/* ===== phone-first layer (tuned for 412 x 915, Galaxy S26 Ultra in Chrome) ===== */
:root{--k-work:#4f5bd5;--k-commute:#8a8c93;--k-class:#8b5cf6;--k-meal:#cdbf9f;--k-sleep:#64748b;--k-gym:#1f8a4c;--k-study:#2d5be3;--k-uni:#b7791f;--k-french:#d14d72}
html{-webkit-text-size-adjust:100%}
button,a,input,select,label,summary{touch-action:manipulation}
.btn:active,.ibtn:active,.chip-btn:active,.sday:active,.play:active,.cell:active,.gbtn:active{transform:scale(.97)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
/* header: big title that tucks away while scrolling */
.top{position:sticky;top:0;z-index:15;background:rgba(247,247,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;transition:padding .2s}
.top h1{transition:font-size .2s,margin .2s}
.top.compact h1{font-size:20px;margin:0}
.top.compact .eyebrow,.top.compact #sub{display:none}
.pill-btn{width:auto!important;padding:0 14px;font-weight:600;font-size:14px;color:var(--accent)!important}

 if (!interactive) throw new Error('Tap Sync to connect Google Drive');
 if (!S.settings.driveClientId) throw new Error('Add your Google OAuth client ID in Plan & settings first');
 await loadGis();
 return new Promise((res, rej) => {
   const tc = google.accounts.oauth2.initTokenClient({client_id:S.settings.driveClientId, scope:'https://www.googleapis.com/auth/drive.appdata',
     callback: r => { if (r.error) return rej(new Error(r.error)); token = r.access_token; tokenExp = now() + (+r.expires_in||3600)*1000; res(token); },
     error_callback: e => rej(new Error(e && e.type ? e.type : 'Google sign-in was closed'))});
   tc.requestAccessToken();
 });
}
async function driveFind(t){
 const q = encodeURIComponent(`name='${DRIVE_NAME}'`);
 const r = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`, {headers:{Authorization:'Bearer '+t}});
 if (!r.ok) throw new Error('Drive list failed ('+r.status+')'); const j = await r.json(); return j.files && j.files[0];
}
async function driveRead(t, id){ const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {headers:{Authorization:'Bearer '+t}}); if (!r.ok) throw new Error('Drive read failed ('+r.status+')'); return r.json(); }
async function driveWrite(t, id, data){
 const body = JSON.stringify(data);
 if (id) { const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {method:'PATCH', headers:{Authorization:'Bearer '+t, 'Content-Type':'application/json'}, body}); if (!r.ok) throw new Error('Drive save failed ('+r.status+')'); return id; }
 const b = 'b' + now(), meta = {name:DRIVE_NAME, parents:['appDataFolder'], mimeType:'application/json'};
 const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
 const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {method:'POST', headers:{Authorization:'Bearer '+t, 'Content-Type':'multipart/related; boundary='+b}, body:mp});
 if (!r.ok) throw new Error('Drive create failed ('+r.status+')'); return (await r.json()).id;
}
async function syncNow(interactive){

 try {
   const t = await getToken(interactive), f = await driveFind(t);
   const before = JSON.stringify(S.setup || null);
   if (f) S = merge(S, await driveRead(t, f.id));
   await driveWrite(t, f && f.id, S); saveLocal();
   setSyncStatus('Synced with Google Drive at ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
   if (JSON.stringify(S.setup || null) !== before) return location.reload();
   renderAll();

}

/* ---------- render: progress ---------- */
function e1rm(w,r){ return w * (1 + r/30); }
function liftSeries(id){
 return Object.keys(S.days).sort().map(k => { const sets = (S.days[k].lifts||{})[id]; if (!sets) return null; const b = Math.max(0, ...sets.filter(s => s && +s.w > 0 && +s.r > 0).map(s => e1rm(+s.w, +s.r))); return b ? {k, v:b} : null; }).filter(Boolean);
}
function spark(series){
 if (series.length < 2) return '<span class="muted small">Log 2+ sessions to see a trend</span>';
 const W = 160, H = 36, vs = series.map(s => s.v), lo = Math.min(...vs), hi = Math.max(...vs), sp = hi - lo || 1;
 const pts = series.map((s,i) => `${(i/(series.length-1)*W).toFixed(1)},${(H - 4 - (s.v-lo)/sp*(H-8)).toFixed(1)}`).join(' ');
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"/></svg>`;
}

<li>Start by reading the last line of yesterday's thesis log; end by writing tomorrow's first step.</li>
<li>Write badly first and edit on another day. 300-400 words a day is a thesis in about four months.</li>
<li>Every second Sunday, send your supervisor a 5-line progress email. It keeps you accountable.</li></ul></details>
<details><summary>Gym hour (4 strength days + Zone 2 + swim + walk)</summary><ul>
<li>Warm-up, 8 min: 5 min easy cardio, then 2 light sets of your first lift.</li>
<li>Main lifts: rest 2-3 min between sets; accessories 60-90 s. Stop each set with 1-2 reps left in the tank.</li>
<li>When every set hits the top of the rep range, add weight next time; the table tells you how much.</li>
<li>Every 6th week is a deload: 2 sets, same weights.</li>
<li>Zone 2 means you can still talk in full sentences. It builds the endurance that also helps your focus.</li>
<li>Sleep 7-9 h, protein about 1.6 g per kg body weight, 8,000+ steps a day. If you have an injury or a medical condition, check with a doctor or physiotherapist first.</li></ul></details>
<details><summary>French (15-45 min)</summary><ul>
<li>Anki first (10 min), then listening: RFI "Journal en fran&ccedil;ais facile" from A2.</li>
<li>Writing: 3-5 sentences about your day, then read them aloud (shadowing builds speaking).</li>
<li>Use it in Luxembourg: order in French, and switch one app to French.</li></ul></details>
<details><summary>Sunday review (15 min)</summary><ol>
<li>Week tab: read the smart review.</li>
<li>Answer the three questions: what went well, what got in the way, one change.</li>
<li>Set next week's Big 3 (press &rarr; on the Week tab).</li>
<li>Plan &amp; settings: export a backup.</li></ol></details>
</div>`;

 if (!v) { el.innerHTML = ''; return; }
 const q = parseQuick(v), d = parse(q.date);
 el.innerHTML = `<span class="chip strong">${esc(q.t || '...')}</span><span class="chip">${daysBetween(TODAY,d) === 0 ? 'Today' : daysBetween(TODAY,d) === 1 ? 'Tomorrow' : fmt(d)}</span>${q.time ? `<span class="chip">${q.time}</span>` : ''}<span class="chip">${q.cat}</span>${q.repeat !== 'none' ? `<span class="chip">${q.repeat}</span>` : ''}`;
}
function addQuick(inp){
 const q = parseQuick(inp.value); if (!q.t) { inp.focus(); return; }
 S.tasks.push({id:uid(), t:q.t, date:q.date, time:q.time, cat:q.cat, repeat:q.repeat, doneOn:{}, u:now()});
 save(); inp.value = ''; document.getElementById('sheet') && document.getElementById('sheet').classList.add('hide');
 renderAll(); toast(`Added: ${q.t}, ${fmt(parse(q.date))}${q.time ? ' ' + q.time : ''}`);
}
function quickCard(){ return `<div class="card"><h2>Quick add</h2><input type="text" id="qa" class="qa" placeholder='Type naturally: "gym tomorrow 18:00", "call supervisor fri 10am weekly", "French homework 12/11"' autocomplete="off"><div class="qa-prev" id="qa-prev"></div><div class="row" style="justify-content:space-between"><span class="muted small">Press Enter to add. Press N anywhere to open quick add.</span><button class="btn primary" data-qa="add-inline">Add</button></div></div>`; }

/* focused time vs. what the plan schedules this week */
function focusCard(){
 const mon = monday(TODAY), ids = ['study','uni','gym','french'];
 const rows = ids.map(id => { let plan = 0, done = 0; for (let i = 0; i < 7; i++) { const d = addDays(mon,i), x = schedule(d)[id]; if (x && habitsFor(d).some(h => h.id === id)) plan += x.e - x.s; done += ((peekDay(key(d)).mins || {})[id] || 0); } return {id, plan, done}; }).filter(r => r.plan);
 return `<div class="card"><h2>Focused time this week</h2>${rows.map(r => { const p = Math.min(100, Math.round(100*r.done/r.plan)); return `<div class="spread small" style="margin-top:10px"><span>${HNAME[r.id]}</span><span class="muted">${fmtDur(r.done)} of ${fmtDur(r.plan)} planned</span></div><div class="bar"><i style="width:${p}%"></i></div>`; }).join('')}<p class="muted small">Counted by the focus timer. Start it with the play button on any block.</p></div>`;
}

document.addEventListener('click', e => {
 const t = e.target.closest('[data-focus],[data-fact],[data-rest],[data-qa]'); if (!t) return; const ds = t.dataset;
 if (ds.focus) return openFocus(ds.focus, ds.k || key(viewDate));
 if (ds.fact === 'pause' && F) { F.running = !F.running; F.last = Date.now(); keepAwake(F.running); return paintFocus(); }
 if (ds.fact === 'done') return closeFocus(true);
 if (ds.fact === 'stop') return closeFocus(false);
 if (ds.rest === 'add' && R) { R.end += 30000; return paintRest(); }
 if (ds.rest === 'skip') { R = null; return document.getElementById('rest').classList.add('hide'); }
 if (ds.qa === 'open') { ensureLiveUI(); document.getElementById('sheet').classList.remove('hide'); return setTimeout(() => document.getElementById('qs').focus(), 50); }
 if (ds.qa === 'close') return document.getElementById('sheet').classList.add('hide');
 if (ds.qa === 'add-sheet') return addQuick(document.getElementById('qs'));
 if (ds.qa === 'add-inline') return addQuick(document.getElementById('qa'));
});
document.addEventListener('input', e => { if (e.target.id === 'qa') previewQuick(e.target, 'qa-prev'); if (e.target.id === 'qs') previewQuick(e.target, 'qs-prev'); });
document.addEventListener('keydown', e => {
 if (e.key === 'Enter' && (e.target.id === 'qa' || e.target.id === 'qs')) return addQuick(e.target);
 if (e.key === 'Escape') { const sh = document.getElementById('sheet'); if (sh) sh.classList.add('hide'); }
 const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if (!typing && !F && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); document.querySelector('[data-qa=open]').click(); }
 if (!typing && !F && tab === 'today' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { viewDate = addDays(viewDate, e.key === 'ArrowRight' ? 1 : -1); renderAll(); }
});
ensureLiveUI();

/* sign-in with GitHub: the plan and progress live in a private repo. A fine-grained token
   with access to that one repo is the key; it is stored only on this device. */
const GH = {owner:'gandhi-taha', repo:'plan-data'};
const TOK = KEY + '-gh';
const ghTok = () => { try { return localStorage.getItem(TOK) || ''; } catch(e) { return ''; } };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const b64enc = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(bin); };
async function ghApi(path, opts = {}, tok = ghTok()){
 return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`, {cache:'no-store', ...opts, headers:{Authorization:`Bearer ${tok}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers || {})}});
}
async function ghRead(file, tok){
 const r = await ghApi(`contents/${file}`, {}, tok);
 if (r.status === 404) return null;
 if (r.status === 401 || r.status === 403) throw new Error('GitHub did not accept this token, or it has no access to the plan-data repo.');
 if (!r.ok) throw new Error(`GitHub error ${r.status}`);
 const j = await r.json(); return {sha:j.sha, data:JSON.parse(b64dec(j.content))};
}
async function ghWrite(file, data, sha, msg){
 const r = await ghApi(`contents/${file}`, {method:'PUT', body:JSON.stringify({message:msg, content:b64enc(JSON.stringify(data)), ...(sha ? {sha} : {})})});
 if (r.status === 409) throw new Error('conflict');
 if (!r.ok) throw new Error(`save failed (${r.status})`);
}
const ghStatus = t => { try { localStorage.setItem(KEY + '-ghsync', t); } catch(e) {} const el = document.getElementById('ghstatus'); if (el) el.textContent = t; };
let ghBusy = false, ghTimer = null;
async function ghSync(tries = 2){
 if (!ghTok() || ghBusy || !navigator.onLine) return; ghBusy = true;
 try {
   const cur = await ghRead('progress.json');
   if (cur) S = merge(S, cur.data);
   const {setup, ...rest} = S;
   await ghWrite('progress.json', rest, cur && cur.sha, `Progress ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`);
   saveLocal(); ghStatus('Synced with GitHub at ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}));
 } catch(e) {
   if (e.message === 'conflict' && tries > 0) { ghBusy = false; return ghSync(tries - 1); }
   ghStatus('Not synced: ' + e.message);
 } finally { ghBusy = false; }
}
const ghSoon = () => { if (!ghTok()) return; clearTimeout(ghTimer); ghTimer = setTimeout(ghSync, 8000); };
async function ghRefresh(){
 try {
   const s = await ghRead('setup.json'); if (!s) return;
   const strip = o => JSON.stringify({...(o || {}), u:0});
   if (strip(s.data) !== strip(S.setup)) { S.setup = {...s.data, u:now()}; saveLocal(); return location.reload(); }
   await ghSync();
   renderAll();
 } catch(e) { ghStatus('Not synced: ' + e.message); }
}
function showLock(){
 let el = document.getElementById('lock'); if (el) return el.classList.remove('hide');
 el = document.createElement('div'); el.id = 'lock'; el.className = 'lock';
 el.innerHTML = `<form class="lock-in" id="lock-form"><img src="icon-192.png" alt="" width="56" height="56"><h1>Private planner</h1><p>Sign in with GitHub to open your plan on this device.</p>
 <a class="btn" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">1. Create a GitHub token</a>
 <p class="lock-note" style="text-align:left">Repository access: <b>Only select repositories → plan-data</b>. Permissions: <b>Contents → Read and write</b>. Pick an expiry you're happy with, then copy the token.</p>
 <div style="display:flex;gap:8px;width:100%"><input type="password" id="lock-pass" autocomplete="off" placeholder="2. Paste the token here" required style="flex:1"><button class="btn" type="button" id="lock-paste">Paste</button></div>
 <button class="btn primary" type="submit" id="lock-go">Sign in with GitHub</button><p class="lock-err" id="lock-err" role="alert"></p>
 <p class="lock-note">The token stays on this device. Without access to the private repo there is nothing to see.</p><a class="lock-home" href="../">gandhi-taha.github.io</a></form>`;
 document.body.appendChild(el);
 el.querySelector('#lock-form').addEventListener('submit', async e => {
   e.preventDefault(); const btn = el.querySelector('#lock-go'), err = el.querySelector('#lock-err'), tok = el.querySelector('#lock-pass').value.trim();
   btn.disabled = true; btn.textContent = 'Signing in...'; err.textContent = '';
   try {
     const setup = await ghRead('setup.json', tok); if (!setup) throw new Error('Signed in, but setup.json is missing from the plan-data repo.');
     localStorage.setItem(TOK, tok);
     const prog = await ghRead('progress.json', tok); if (prog) S = merge(S, prog.data);
     S.setup = {...setup.data, u:now()}; saveLocal(); location.reload();
   } catch(x) { err.textContent = x.message; btn.disabled = false; btn.textContent = 'Sign in with GitHub'; }
 });
 el.querySelector('#lock-paste').addEventListener('click', async () => { try { el.querySelector('#lock-pass').value = (await navigator.clipboard.readText()).trim(); } catch(x) { el.querySelector('#lock-pass').focus(); } });
 setTimeout(() => el.querySelector('#lock-pass').focus(), 50);
}
document.addEventListener('click', e => {
 const t = e.target.closest('[data-act="lock"],[data-act="show-lock"],[data-act="ghsync"]'); if (!t) return;
 if (t.dataset.act === 'show-lock') return showLock();
 if (t.dataset.act === 'ghsync') { ghStatus('Syncing...'); return ghSync(); }
 if (confirm('Sign out on this device? Your plan and progress are removed from this device; they stay in your private GitHub repo.')) { const go = () => { try { [KEY, KEY + '-sync', KEY + '-ghsync', TOK].forEach(k => localStorage.removeItem(k)); } catch(x) {} location.reload(); }; ghTok() ? ghSync().finally(go) : go(); }
});
window.addEventListener('online', ghSoon);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ghSync(); });
if (!SETUP || !ghTok()) showLock(); else ghRefresh();

/* ===== phone touches: haptics, swipe between days, collapsing header, app shortcuts ===== */
const buzz = (ms = 8) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} };
let vtBusy = false;
const transition = fn => { if (!document.startViewTransition || vtBusy || matchMedia('(prefers-reduced-motion: reduce)').matches) return fn(); vtBusy = true; const vt = document.startViewTransition(fn); [vt.ready, vt.finished, vt.updateCallbackDone].forEach(pr => pr.catch(() => {})); vt.finished.finally(() => { vtBusy = false; }); };
const liftOpen = {};
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('lifts')) liftOpen[key(viewDate)] = e.target.open; }, true);
document.addEventListener('click', e => {
 const t = e.target.closest('[data-sleep],[data-wmode],[data-fill]'); if (!t) return;
 const day = touch(getDay(key(viewDate)));
 if (t.dataset.sleep) { const v = t.dataset.sleep; day.sleep = parseFloat(day.sleep) === parseFloat(v) ? '' : v; }
 if (t.dataset.wmode) { const m = t.dataset.wmode; day.off = m === 'off'; day.home = m === 'home'; }
 if (t.dataset.fill) { const last = lastSets(t.dataset.fill, key(viewDate)), arr = day.lifts[t.dataset.fill] || (day.lifts[t.dataset.fill] = []); last.forEach((s, i) => { arr[i] = arr[i] || {}; if (!arr[i].w) arr[i].w = s.w; }); liftOpen[key(viewDate)] = true; }
 buzz(); save(); renderAll();
});
// swipe left/right on Today to change day
(() => {
 let x0 = null, y0 = null, t0 = 0;
 const el = document.getElementById('today');
 el.addEventListener('touchstart', e => { if (e.target.closest('input,textarea,select,.chips,.scroll,details.lifts,.strip')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); }, {passive:true});
 el.addEventListener('touchend', e => {
   if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
   if (Math.abs(dx) > 70 && Math.abs(dx) > 1.6 * Math.abs(dy) && Date.now() - t0 < 600) { buzz(6); transition(() => { viewDate = addDays(viewDate, dx < 0 ? 1 : -1); renderAll(); }); }
 }, {passive:true});
 // swipe on the week strip changes week
 document.addEventListener('touchstart', e => { const s = e.target.closest('.strip'); if (!s) return; s._x = e.touches[0].clientX; }, {passive:true});
 document.addEventListener('touchend', e => { const s = e.target.closest('.strip'); if (!s || s._x == null) return; const dx = e.changedTouches[0].clientX - s._x; s._x = null; if (Math.abs(dx) > 60) { buzz(6); transition(() => { viewDate = addDays(viewDate, dx < 0 ? 7 : -7); renderAll(); }); } }, {passive:true});
})();
// big title collapses into a compact bar while scrolling
(() => { const top = document.querySelector('.top'); let on = false, lastY = 0; addEventListener('scroll', () => { const y = scrollY, c = y > 40; if (c !== on) { on = c; top.classList.toggle('compact', c); } const fab = document.getElementById('fab'); if (fab && Math.abs(y - lastY) > 6) { fab.classList.toggle('fab-away', y > lastY && y > 120); lastY = y; } }, {passive:true}); })();
// home-screen shortcuts: ?action=add, ?action=focus, ?tab=...
(() => {
 const q = new URLSearchParams(location.search); if (!SETUP) return;
 const t = q.get('tab'); if (t && TITLES[t]) showTab(t);
 const a = q.get('action');
 if (a === 'add') setTimeout(() => document.querySelector('[data-qa=open]').click(), 300);
 if (a === 'focus') { const m = nowMin(), nx = timeline(new Date(TODAY)).find(x => x.id && !x.done && x.e > m); if (nx) setTimeout(() => openFocus(nx.id, key(TODAY)), 300); }
 if (t || a) history.replaceState(null, '', location.pathname);
})();

/* ---------- day outlook, sections, embedded French app ---------- */
const secOpen = {}, sbOpen = {};
const FRENCH_URL = /github\.io$/.test(location.hostname) ? '../french/' : 'https://gandhi-taha.github.io/french/';
function outlook(d){
 const sc = schedule(d), hs = habitsFor(d), cls = classFor(d), bed = T(SET('bed')), wind = bed - 30;
 const ivs = [...sc.fixed.filter(f => f.kind !== 'sleep'), ...hs.map(h => sc[h.id]).filter(Boolean)].map(x => [x.s, x.e]).sort((a,b) => a[0] - b[0]);
 let busyM = 0, cs = -1, ce = -1;
 ivs.forEach(([s,e]) => { if (s > ce) { if (ce > cs) busyM += ce - cs; cs = s; ce = e; } else ce = Math.max(ce, e); }); if (ce > cs) busyM += ce - cs;
 const start = sc.wake != null ? sc.wake : (ivs.length ? ivs[0][0] - 45 : 480), span = Math.max(1, wind - start), free = Math.max(0, span - busyM);
 const sumK = kk => sc.fixed.filter(f => f.kind === kk).reduce((a,f) => a + f.e - f.s, 0);
 const mine = hs.reduce((a,h) => { const x = sc[h.id]; return a + (x && !(cls && h.id === 'french') ? x.e - x.s : 0); }, 0);
 const nx = schedule(addDays(d,1)), nextWake = nx.wake != null ? nx.wake : 480, sleep = 1440 - bed + nextWake;
 const ratio = busyM / span, level = free < 45 ? 'Packed' : ratio > 0.85 ? 'Busy' : ratio > 0.7 ? 'Full' : 'Relaxed';
 return {work:sumK('work'), commute:sumK('commute'), cls: cls ? cls.e - cls.s : 0, mine, free, sleep, level, light: !!peekDay(key(d)).light};
}
document.addEventListener('toggle', e => { const t = e.target; if (t.classList && t.classList.contains('sec')) secOpen[t.dataset.sec] = t.open; }, true);
document.addEventListener('click', e => {
 const t = e.target.closest('[data-sbx],[data-light],[data-frfull],[data-frgo]'); if (!t) return;
 if (t.hasAttribute('data-frgo')) { const w = document.getElementById('fr-wrap'); if (!w) return; const sec = w.closest('details.sec'); if (sec && !sec.open) { sec.open = true; secOpen[sec.dataset.sec] = true; } mountFrench(); return w.scrollIntoView({behavior:'smooth', block:'start'}); }
 if (t.dataset.sbx) { const ok = `${key(viewDate)}|${t.dataset.sbx}`, cur = t.getAttribute('aria-expanded') === 'true'; sbOpen[ok] = !cur; if (typeof buzz === 'function') buzz(5); return renderAll(); }
 if (t.dataset.light) { const day = touch(getDay(key(viewDate))); day.light = t.dataset.light === '1'; save(); if (typeof buzz === 'function') buzz(10); return renderAll(); }
 if (t.hasAttribute('data-frfull')) { const w = document.getElementById('fr-wrap'); const on = !w.classList.contains('full'); w.classList.toggle('full', on); t.textContent = on ? 'Close' : 'Full screen'; document.body.classList.toggle('noscroll', on); }
});
// the French app lives in one iframe that is moved, not reloaded, when the page re-renders
let FR_FRAME = null, FR_TRACK = null;
function frenchFrame(){
 if (!FR_FRAME) { FR_FRAME = document.createElement('iframe'); FR_FRAME.src = FRENCH_URL; FR_FRAME.title = 'French course'; FR_FRAME.className = 'fr-frame'; FR_FRAME.setAttribute('allow', 'autoplay; clipboard-write; fullscreen'); FR_FRAME.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-downloads'); FR_FRAME.setAttribute('referrerpolicy', 'same-origin'); }
 return FR_FRAME;
}
const moveInto = (parent, node) => { if (node.isConnected && parent.moveBefore) { try { return parent.moveBefore(node, null); } catch(e) {} } return parent.appendChild(node); };
function frCommit(rerender){
 if (!FR_TRACK) return;
 const mins = Math.floor((Date.now() - FR_TRACK.since) / 60000); if (mins < 1) return;
 FR_TRACK.since += mins * 60000;
 const day = touch(getDay(FR_TRACK.k)); day.mins = day.mins || {}; day.mins.french = (day.mins.french || 0) + mins;
 const sc = schedule(parse(FR_TRACK.k)), planned = sc.french ? sc.french.e - sc.french.s : 15, total = day.mins.french;
 if (total >= planned) day.checks.french = 1; else if (total >= 5 && !(day.checks.french > 0)) day.checks.french = 0.5;
 save(); if (rerender) renderAll();
}
function mountFrench(){
 const slot = document.getElementById('fr-slot');
 let park = document.getElementById('fr-park'); if (!park) { park = document.createElement('div'); park.id = 'fr-park'; park.hidden = true; document.body.appendChild(park); }
 if (slot) { if (FR_FRAME && FR_FRAME.parentNode === slot) return; moveInto(slot, frenchFrame()); if (!FR_TRACK) FR_TRACK = {k:key(viewDate), since:Date.now()}; }
 else { if (FR_FRAME && FR_FRAME.parentNode !== park) moveInto(park, FR_FRAME); if (FR_TRACK) { frCommit(false); FR_TRACK = null; } document.body.classList.remove('noscroll'); }
}
setInterval(() => { if (FR_TRACK && document.visibilityState === 'visible') { const el = document.getElementById('fr-live'), day = peekDay(FR_TRACK.k), mins = ((day.mins || {}).french || 0) + Math.floor((Date.now() - FR_TRACK.since) / 60000); if (el) el.textContent = `${fmtDur(mins)} so far`; } }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') frCommit(false); else if (FR_TRACK) FR_TRACK.since = Date.now(); });
addEventListener('pagehide', () => frCommit(false));

renderAll();
</script>
