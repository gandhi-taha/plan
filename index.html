<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Improvement Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f7f7f4">
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light;
 --bg:#f7f7f4;--surface:#fff;--ink:#1b1c1f;--ink-2:#55575e;--ink-3:#8b8d94;--line:#e6e5df;--line-2:#f1f0eb;
 --accent:#2d5be3;--accent-ink:#1f43b5;--accent-soft:#edf1fd;
 --good:#1f8a4c;--good-soft:#e7f3eb;--half:#b7791f;--half-soft:#fbf2e2;--bad:#c53030;--bad-soft:#fbeaea;--warn:#b7791f;--warn-soft:#fbf2e2;
 --muted:var(--ink-3);--card:var(--surface);
 --r:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 24px}
/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 6px;font-weight:700}
#sub{font-size:14px;color:var(--ink-2)}
.icons{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ibtn:hover{color:var(--ink)}
.ibtn svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#syncbtn{display:none}
/* navigation: bottom bar on phones, sidebar on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 8px;border-radius:10px;cursor:pointer;min-width:58px}
.nav button.on{color:var(--accent)}
.nav .brand,.nav .wide{display:none}
@media (min-width:900px){
 body{padding-bottom:0}
 .nav{top:0;right:auto;width:228px;flex-direction:column;justify-content:flex-start;gap:2px;padding:24px 14px;border-top:0;border-right:1px solid var(--line);background:var(--bg);backdrop-filter:none}
 .nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:0 10px 18px}
 .nav .brand img{width:28px;height:28px;border-radius:8px}
 .nav .wide{display:flex}
 .nav button{flex-direction:row;gap:12px;font-size:14.5px;font-weight:500;color:var(--ink-2);padding:9px 12px;width:100%}
 .nav button:hover{background:var(--line-2)}
 .nav button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
 .nav button.on svg{color:var(--accent)}
 .wrap{margin-left:228px;max-width:none;padding:28px 40px}
 main,.top{max-width:860px}
 .mob{display:none}
}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 10px}
.card h3{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;font-size:14px}
.btn:hover{border-color:#cfcec7}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.alert{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:14px;color:var(--ink)}
.alert.warn{border-left-color:var(--half)}
.alert.bad{border-left-color:var(--bad)}
.alert.good{border-left-color:var(--good)}
.alert.info{border-left-color:var(--accent)}
/* day plan */
.block{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line-2)}
.block:first-of-type{border-top:0;padding-top:4px}
.time{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;font-weight:550;padding-top:2px}
.block .title{font-weight:650;font-size:15.5px;letter-spacing:-.005em}
.block .detail{margin-top:2px;color:var(--ink-2)}
.block .min{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.check{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:2px 0;color:var(--ink-3);font-size:13px;font-weight:550}
.check .dot{width:28px;height:28px;border-radius:50%;border:1.75px solid #c9c8c1;display:grid;place-items:center;font-size:15px;line-height:1;color:#fff;transition:all .15s}
.check:hover .dot{border-color:var(--ink-2)}
.check.s1{color:var(--good)} .check.s1 .dot{background:var(--good);border-color:var(--good)} .check.s1 .dot::after{content:"\2713"}
.check.s5{color:var(--half)} .check.s5 .dot{border-color:var(--half);background:linear-gradient(90deg,var(--half) 50%,transparent 50%)}
.check.s0{color:var(--bad)} .check.s0 .dot{border-color:var(--bad);color:var(--bad)} .check.s0 .dot::after{content:"\00d7"}
.check .lab{min-width:62px;text-align:left}
/* controls */
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)}
input[type=number],input[type=text],input[type=date],input[type=time],textarea,select{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:64px;resize:vertical;margin-top:4px}
input.n{width:68px;padding:6px 8px}
label.small{display:block;margin-bottom:10px;color:var(--ink-2)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.lift{margin:2px 0 6px}
.lift td{padding:8px 6px}
/* week grid */
.wk{display:grid;grid-template-columns:100px repeat(7,1fr);gap:5px;font-size:13px}
.wk .h{color:var(--ink-3);font-weight:600;text-align:center;padding:4px 0;font-size:12px}
.wk .h.today{color:var(--accent)}
.wk .lbl{font-weight:600;padding:9px 0;color:var(--ink-2)}
.cell{border-radius:10px;text-align:center;padding:8px 0;cursor:pointer;background:var(--line-2);color:var(--ink-3);user-select:none;font-weight:600}
.cell.s1{background:var(--good-soft);color:var(--good)}
.cell.s5{background:var(--half-soft);color:var(--half)}
.cell.s0{background:var(--bad-soft);color:var(--bad)}
.cell.na{cursor:default;background:none;color:var(--line)}
.big3 label{display:flex;gap:10px;align-items:center;margin:8px 0}
.big3 input[type=text]{flex:1}
.big3 input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}
/* stats */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;font-size:11px;max-width:420px}
.heat div{height:20px;border-radius:5px}
.heat .lab{height:auto;color:var(--ink-3)}
.bar{height:6px;background:var(--line-2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
details{border-top:1px solid var(--line-2);padding:10px 0}
summary{cursor:pointer;font-weight:600}
ul,ol{margin:6px 0;padding-left:20px;color:var(--ink-2)}
li{margin:4px 0}
code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:13px}
.hide{display:none}
/* spreadsheet */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.xl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.xl th,table.xl td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;height:34px;text-align:center;white-space:nowrap;vertical-align:middle}
table.xl tr:last-child td{border-bottom:0}
table.xl th{background:#fafaf8;position:sticky;top:0;z-index:1;padding:5px 6px;font-weight:600;color:var(--ink-3);font-size:11.5px;border-bottom:1px solid var(--line)}
table.xl td.lbl,table.xl th.lbl{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 10px;font-weight:600;color:var(--ink);border-right:1px solid var(--line)}
table.xl th.lbl{background:#fafaf8;z-index:3}
table.xl th.today{color:var(--accent);background:var(--accent-soft)}
table.xl td.c{min-width:32px;cursor:pointer;user-select:none;font-weight:700}
table.xl td.c:hover{background:var(--line-2)}
table.xl td.c.s1{background:var(--good-soft);color:var(--good)}
table.xl td.c.s5{background:var(--half-soft);color:var(--half)}
table.xl td.c.s0{background:var(--bad-soft);color:var(--bad)}
table.xl td.c.na{cursor:default;background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line-2) 5px 6px)}
table.xl td.tot{font-weight:700;padding:0 10px;font-variant-numeric:tabular-nums}
table.xl input,table.xl select{border:0;background:transparent;border-radius:0;width:100%;height:34px;padding:0 8px;box-shadow:none}
table.xl input[type=checkbox]{width:18px;height:18px;accent-color:var(--good)}
table.goals td{text-align:left}
table.goals tr.done td{background:#f6faf7}
table.goals tr.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
table.goals tr.late td{background:#fdf6f6}
table.goals tr.late input[data-gf=due]{color:var(--bad);font-weight:600}
.pbar{display:flex;align-items:center;gap:8px;padding:0 8px;min-width:130px}
.pbar .bar{flex:1}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2);font-weight:550}
/* planner */
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--good);flex:none}
.task .tt{flex:1}
.task .time{min-width:44px}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;padding:0 4px}
.x:hover{color:var(--bad)}
.form{display:grid;grid-template-columns:2fr 1.1fr .9fr 1fr .9fr auto;gap:8px}
@media (max-width:620px){
 .wrap{padding:14px 14px 20px}
 .top h1{font-size:28px}
 .form{grid-template-columns:1fr 1fr}.form input[type=text]{grid-column:1/-1}.form .btn{grid-column:1/-1}
 .block{grid-template-columns:1fr auto;gap:4px 12px}
 .block .time{grid-column:1/-1;padding:0}
 .wk{grid-template-columns:64px repeat(7,1fr);gap:3px;font-size:12px}
 .check .lab{display:none}
}
/* week strip on Today */
.strip{display:flex;align-items:stretch;gap:6px;margin-bottom:16px}
.strip .ibtn{width:34px;height:auto;flex:none}
.sday{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.sday span{font-size:11px;color:var(--ink-3);font-weight:600}
.sday b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.sday i{display:block;width:58%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--good) calc(var(--p)*1%),var(--line-2) 0)}
.sday.now b{color:var(--accent)}
.sday.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.sday.sel span{color:rgba(255,255,255,.65)}
.sday.sel b{color:#fff}
.sday.sel i{background:linear-gradient(90deg,#7ee2a5 calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
@media (max-width:420px){.strip{gap:4px}.strip .ibtn{width:26px}.sday{border-radius:12px}}
.block.fixed{padding:9px 0}
.block.fixed .title{color:var(--ink-3);font-weight:550;font-size:14px}
.block.fixed.work .title{color:var(--ink-2)}
.block.fixed.class .title{color:var(--accent-ink)}
/* live layer */
.card.now{padding:18px 20px;background:linear-gradient(180deg,#fff, #fbfbf9)}
.now-grid{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.now-ring{position:relative;width:68px;height:68px}
.now-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;letter-spacing:-.02em}
.now-ring b small{font-size:11px;color:var(--ink-3);font-weight:600}
.now-title{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:2px;line-height:1.25}
.now-sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.now-then{color:var(--ink-3);font-size:13px;margin-top:8px}
.now-then b{color:var(--ink-2);font-weight:600}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,76,.45)}70%{box-shadow:0 0 0 7px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}
.mom{display:flex;align-items:flex-end;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.spark{flex:1;display:flex;align-items:flex-end;gap:4px;height:34px}
.spark i{flex:1;background:var(--good-soft);border-radius:3px;min-height:3px;transition:height .4s}
.spark i.today{background:var(--good)}
.acts{display:flex;align-items:center;gap:10px}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;flex:none}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:12px;height:12px;fill:currentColor;margin-left:2px}
.check.s1 .dot{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.focus{position:fixed;inset:0;z-index:50;background:rgba(247,247,244,.97);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.f-in{max-width:520px;width:100%;text-align:center}
.f-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 18px}
.f-ring{position:relative;width:220px;height:220px;margin:0 auto}
.f-ring svg{display:block}
.f-time{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.f-detail{color:var(--ink-2);margin-top:18px;font-size:15px}
.f-stats{color:var(--ink-3);font-size:13px;margin-top:6px}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:280px}
.rest div{flex:1;display:flex;flex-direction:column}
.rest b{font-size:17px;font-variant-numeric:tabular-nums}
.rest span{font-size:12px;opacity:.7}
.rest .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;padding:6px 10px}
.rest .x{color:#fff;opacity:.7}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:18px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(20,20,22,.28);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
input.qa,#qs{width:100%;font-size:16px;padding:12px 14px}
.qa-prev{display:flex;flex-wrap:wrap;gap:6px;min-height:8px;margin:8px 0}
.chip{font-size:12.5px;padding:3px 9px;border-radius:7px;background:var(--line-2);color:var(--ink-2);font-weight:550}
.chip.strong{background:var(--accent-soft);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:18px;z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hide.focus,.hide.rest,.hide.sheet,.hide.toast{display:none}
@media (min-width:900px){.fab{bottom:28px;right:28px}.rest{bottom:28px}.sheet{align-items:center}.sheet-in{border-radius:20px}}
@media (max-width:620px){.now-grid{grid-template-columns:auto 1fr}.now-act{grid-column:1/-1}.now-act .btn{width:100%}}
</style>

</head>
<body>
<nav class="nav" id="tabs">
  <div class="brand"><img src="icon-192.png" alt="">Improvement Plan</div>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15.2" r="1.5" fill="currentColor" stroke="none"/></svg>Today</button>
  <button data-tab="planner"><svg viewBox="0 0 24 24"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="M4 6.5l1.2 1.2L7 5.5M4 12l1.2 1.2L7 11"/><circle cx="5.3" cy="17.5" r="1.1"/></svg>Planner</button>
  <button data-tab="tracker"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17"/></svg>Tracker</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><path d="M4 7.5h16M4 12h16M4 16.5h10"/></svg>Week</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 17l5-5.5 3.5 3L20 6.5"/><path d="M15 6.5h5v5"/></svg>Progress</button>
  <button data-tab="plan" class="wide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.3M12 18.2v2.3M3.5 12h2.3M18.2 12h2.3M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg>Plan &amp; settings</button>
  <button data-tab="guide" class="wide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 1 1 3.1 2.1c-.6.3-.9.8-.9 1.4v.4"/><circle cx="12" cy="16.6" r=".9" fill="currentColor" stroke="none"/></svg>How to</button>
</nav>
<div class="wrap">
<header class="top">

/* ---------- render: progress ---------- */
function e1rm(w,r){ return w * (1 + r/30); }
function liftSeries(id){
 return Object.keys(S.days).sort().map(k => { const sets = (S.days[k].lifts||{})[id]; if (!sets) return null; const b = Math.max(0, ...sets.filter(s => s && +s.w > 0 && +s.r > 0).map(s => e1rm(+s.w, +s.r))); return b ? {k, v:b} : null; }).filter(Boolean);
}
function spark(series){
 if (series.length < 2) return '<span class="muted small">Log 2+ sessions to see a trend</span>';
 const W = 160, H = 36, vs = series.map(s => s.v), lo = Math.min(...vs), hi = Math.max(...vs), sp = hi - lo || 1;
 const pts = series.map((s,i) => `${(i/(series.length-1)*W).toFixed(1)},${(H - 4 - (s.v-lo)/sp*(H-8)).toFixed(1)}`).join(' ');
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"/></svg>`;
}

 let h = `<div class="card"><h2>Streaks</h2><div class="grid">${['gym','study','uni','french'].map(id => `<div class="stat"><div class="muted small">${HNAME[id]}</div><div class="v">${streak(id)} days</div></div>`).join('')}</div><p class="muted small">A streak counts planned days done (minimum version counts). Unplanned days don't break it.</p></div>`;

 h += focusCard();
 if (S.settings.weight) h += `<div class="card"><h2>Nutrition target</h2><p>Protein about <b>${Math.round(1.6*S.settings.weight)} g a day</b> (1.6 g per kg at ${esc(S.settings.weight)} kg), 2-3 L water, 8,000+ steps.</p></div>`;

/* ---------- render: guide ---------- */
function renderGuide(){
 document.getElementById('guide').innerHTML = `
<div class="card"><h2>The methods behind this page</h2><ul>
<li><b>Time-blocking:</b> every habit has a fixed slot, so you never decide "when". Put the slots in your calendar.</li>
<li><b>Minimum version</b> (from James Clear's <i>Atomic Habits</i>): on bad days, do the small version. It counts half and keeps the habit alive.</li>
<li><b>Never miss twice:</b> one miss is life; two in a row is a new habit. The page warns you the day after a miss.</li>
<li><b>Weekly Big 3:</b> 2-3 outcomes per week, not 20 tasks. Set them on Sunday.</li>
<li><b>Weekly review</b> (from David Allen's <i>Getting Things Done</i>): 15 minutes every Sunday, with the smart review on the Week tab.</li>
<li><b>Pomodoro blocks:</b> 25 minutes of focus and 5 off; two of them make your study hour.</li>
<li><b>Progressive overload:</b> the gym table tells you when to add weight, based on your last session.</li>
<li><b>Spaced repetition</b> (Anki) for French and exam facts.</li>
<li><b>Readiness check-in:</b> sleep and energy adjust the day's advice.</li>
</ul></div>
<div class="card"><h2>How to do each activity</h2>
<details open><summary>Study hour (AIGP and later exams)</summary><ul>
<li>Phone in another room, one browser tab, today's topic only.</li>
<li>Block 1 (25 min): read or watch. Block 2 (25 min): close the source and write what you remember, then check.</li>
<li>Last 10 min: write a 5-line summary and add any new facts to Anki.</li>
<li>Saturday long blocks: practice questions. Every wrong answer goes in a "mistakes" note with the reason.</li></ul></details>
<details><summary>Uni hour (thesis)</summary><ul>
<li>Rule: every session ends with something visible: a paragraph, a commit, a results line, or a paper note.</li>

function addQuick(inp){
 const q = parseQuick(inp.value); if (!q.t) { inp.focus(); return; }
 S.tasks.push({id:uid(), t:q.t, date:q.date, time:q.time, cat:q.cat, repeat:q.repeat, doneOn:{}, u:now()});
 save(); inp.value = ''; document.getElementById('sheet') && document.getElementById('sheet').classList.add('hide');
 renderAll(); toast(`Added: ${q.t}, ${fmt(parse(q.date))}${q.time ? ' ' + q.time : ''}`);
}
function quickCard(){ return `<div class="card"><h2>Quick add</h2><input type="text" id="qa" class="qa" placeholder='Type naturally: "gym tomorrow 18:00", "call supervisor fri 10am weekly", "INL homework 12/11"' autocomplete="off"><div class="qa-prev" id="qa-prev"></div><div class="row" style="justify-content:space-between"><span class="muted small">Press Enter to add. Press N anywhere to open quick add.</span><button class="btn primary" data-qa="add-inline">Add</button></div></div>`; }

/* focused time vs. what the plan schedules this week */
function focusCard(){
 const mon = monday(TODAY), ids = ['study','uni','gym','french'];
 const rows = ids.map(id => { let plan = 0, done = 0; for (let i = 0; i < 7; i++) { const d = addDays(mon,i), x = schedule(d)[id]; if (x && habitsFor(d).some(h => h.id === id)) plan += x.e - x.s; done += ((peekDay(key(d)).mins || {})[id] || 0); } return {id, plan, done}; }).filter(r => r.plan);
 return `<div class="card"><h2>Focused time this week</h2>${rows.map(r => { const p = Math.min(100, Math.round(100*r.done/r.plan)); return `<div class="spread small" style="margin-top:10px"><span>${HNAME[r.id]}</span><span class="muted">${fmtDur(r.done)} of ${fmtDur(r.plan)} planned</span></div><div class="bar"><i style="width:${p}%"></i></div>`; }).join('')}<p class="muted small">Counted by the focus timer. Start it with the play button on any block.</p></div>`;
}

document.addEventListener('click', e => {
 const t = e.target.closest('[data-focus],[data-fact],[data-rest],[data-qa]'); if (!t) return; const ds = t.dataset;
 if (ds.focus) return openFocus(ds.focus, ds.k || key(viewDate));
 if (ds.fact === 'pause' && F) { F.running = !F.running; F.last = Date.now(); keepAwake(F.running); return paintFocus(); }
 if (ds.fact === 'done') return closeFocus(true);
 if (ds.fact === 'stop') return closeFocus(false);
 if (ds.rest === 'add' && R) { R.end += 30000; return paintRest(); }
 if (ds.rest === 'skip') { R = null; return document.getElementById('rest').classList.add('hide'); }
 if (ds.qa === 'open') { ensureLiveUI(); document.getElementById('sheet').classList.remove('hide'); return setTimeout(() => document.getElementById('qs').focus(), 50); }
 if (ds.qa === 'close') return document.getElementById('sheet').classList.add('hide');
 if (ds.qa === 'add-sheet') return addQuick(document.getElementById('qs'));
 if (ds.qa === 'add-inline') return addQuick(document.getElementById('qa'));
});
document.addEventListener('input', e => { if (e.target.id === 'qa') previewQuick(e.target, 'qa-prev'); if (e.target.id === 'qs') previewQuick(e.target, 'qs-prev'); });
document.addEventListener('keydown', e => {
 if (e.key === 'Enter' && (e.target.id === 'qa' || e.target.id === 'qs')) return addQuick(e.target);
 if (e.key === 'Escape') { const sh = document.getElementById('sheet'); if (sh) sh.classList.add('hide'); }
 const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if (!typing && !F && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); document.querySelector('[data-qa=open]').click(); }
 if (!typing && !F && tab === 'today' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { viewDate = addDays(viewDate, e.key === 'ArrowRight' ? 1 : -1); renderAll(); }
});
ensureLiveUI();

renderAll();
</script>
